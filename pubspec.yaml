name: shelf_elf
description: A food inventory management app with barcode scanning and meal planning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  mobile_scanner: ^7.0.0
  http: ^1.2.1
  intl: ^0.20.3
  provider: ^6.1.2
  cupertino_icons: ^2.0.0
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.6
  app_links: ^7.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  # Firebase — sync and shared accounts
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  # Ads
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
